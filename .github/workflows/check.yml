name: Check

# Build, type-check and audit every pull request before it can reach main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - name: No inline executable scripts (the CSP allows 'self' only)
        run: |
          if grep -rhoE '<script(\s[^>]*)?>' dist --include='*.html' | grep -vE 'src=|application/ld\+json' | grep -q .; then
            echo "Inline <script> found in dist"; exit 1; fi
      - name: No legal placeholders left (fill `legal` in src/data/site.ts)
        run: |
          if grep -rl 'to be confirmed]' dist --include='*.html' | grep -q .; then
            echo "Legal placeholders found:"; grep -rl 'to be confirmed]' dist --include='*.html'; exit 1; fi
      - run: npm audit --audit-level=high --omit=dev
